# Formatter and linter settings for maintainers; see DEVELOPMENT.md.
# Not used at runtime. Pinned here so results do not depend on a global config.
target-version = "py310"  # SKILL.md requires Python 3.10+
line-length = 88

[lint]
extend-select = ["I"]  # import order; ruff's defaults cover the rest

[lint.isort]
known-first-party = ["store", "kg", "ingest", "bench", "bootstrap"]
